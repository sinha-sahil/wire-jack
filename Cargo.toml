[package]
name = "wire-jack"
version = "1.1.0"
edition = "2021"
description = "Construct API-call contracts with temple-dsl, render them against inputs, and execute the resulting requests"
license = "MIT"
repository = "https://github.com/sinha-sahil/wire-jack"
readme = "README.md"
keywords = ["http", "api", "template", "curl", "reqwest"]
categories = ["web-programming::http-client", "template-engine"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "multipart", "cookies"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "fs",
    "time",
] }
thiserror = "2"
base64 = "0.22"
temple-dsl = { version = "0.3", features = ["json"] }

[dev-dependencies]
tokio = { version = "1", features = ["net", "io-util"] }
